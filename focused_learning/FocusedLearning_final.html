<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusedLearning — Architecture Pattern Capture</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%23006d77' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='3' fill='%23006d77'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..500;1,6..72,400..500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1E8; --paper-2:#EAE6D8; --card:#FBF9F2;
  --ink:#191510; --ink-2:#544D3D; --ink-3:#8B8471;
  --line:#DAD4C4; --line-2:#C8C1AC;
  --acc:#006d77; --acc-deep:#A33412; --acc-soft:rgba(200,64,26,.12);
  --side:#161209; --side-ink:#EFEAD9; --side-dim:rgba(239,234,217,.55); --side-line:rgba(239,234,217,.13); --acc-bright:#007e87;
  --f-sans:'Space Grotesk',sans-serif; --f-mono:'JetBrains Mono',monospace; --f-serif:'Newsreader',serif;
  --dgi:#191510; --dgd:#8B8471; --dga:#006d77; --dgt:#544D3D;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--f-sans);background:var(--paper);color:var(--ink);overflow:hidden}
::selection{background:var(--acc-soft)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font-family:inherit;color:inherit}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border:3px solid var(--paper);border-radius:6px}
#sidebar *::-webkit-scrollbar-thumb{background:rgba(239,234,217,.2);border-color:var(--side)}
#sidebar{--dgi:#EFEAD9;--dgd:rgba(239,234,217,.45);--dga:#007e87;--dgt:rgba(239,234,217,.72)}
.ic{flex:none}

#app{display:flex;height:100vh}

/* ============ DIAGRAM INK ============ */
.diag{display:block}
.diag .dg-b{stroke:var(--dgi);stroke-width:1.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
.diag .dg-d{stroke:var(--dgd);stroke-width:1;fill:none;stroke-dasharray:3 3;stroke-linecap:round;stroke-linejoin:round}
.diag .dg-da{stroke:var(--dga);stroke-width:1;fill:none;stroke-dasharray:2.5 2.5;stroke-linecap:round;stroke-linejoin:round}
.diag .dg-a{stroke:var(--dga);stroke-width:1.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.diag .dg-h{stroke:var(--dgd);stroke-width:.8;stroke-linecap:round}
.diag .dg-bus{stroke:var(--dgi);stroke-width:4;stroke-linecap:round}
.diag .dg-f{fill:var(--dgi);stroke:none}
.diag .dg-fa{fill:var(--dga);stroke:none}
.diag .dg-t{font-family:var(--f-mono);font-size:6px;fill:var(--dgt);letter-spacing:.03em}
.diag .dg-ta{fill:var(--dga)}

/* ============ SIDEBAR ============ */
#sidebar{width:322px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;z-index:30}
.sb-head{padding:22px 20px 18px;border-bottom:1px solid var(--side-line);display:flex;gap:13px;align-items:center}
.logo-spin{transform-origin:18px 18px;animation:spin 26s linear infinite}
.wordmark{font-family:var(--f-mono);font-weight:600;letter-spacing:.2em;font-size:12.5px;white-space:nowrap}
.wordmark b{color:var(--acc-bright);font-weight:600}
.wordsub{font-family:var(--f-mono);font-size:8px;letter-spacing:.17em;color:var(--side-dim);margin-top:4px;white-space:nowrap}
.add-slot{margin:16px 16px 12px;border:1px dashed rgba(239,234,217,.3);background:none;color:var(--side-dim);
  padding:11px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.18s}
.add-slot:hover{border-color:var(--acc-bright);color:var(--side-ink)}
.sb-search{margin:0 16px 12px;position:relative}
.sb-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--side-dim);pointer-events:none}
.sb-search input{width:100%;background:rgba(239,234,217,.06);border:1px solid var(--side-line);color:var(--side-ink);
  font-family:var(--f-mono);font-size:11.5px;padding:9px 10px 9px 32px}
.sb-search input::placeholder{color:rgba(239,234,217,.35)}
.sb-search input:focus{outline:none;border-color:var(--acc-bright)}
.sb-nav{padding:2px 12px 12px;border-bottom:1px solid var(--side-line)}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;font-family:var(--f-mono);
  font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--side-dim);background:none;border:0;cursor:pointer;transition:.15s}
.nav-item:hover{color:var(--side-ink)}
.nav-item.active{color:var(--side-ink);background:rgba(239,234,217,.07);box-shadow:inset 2px 0 0 var(--acc-bright)}
.nav-item .cnt,.nav-item .due{margin-left:auto;font-size:9.5px}
.nav-item .cnt{color:var(--side-dim)}
.nav-item .due{background:var(--acc-bright);color:#1A0D06;font-weight:600;padding:1px 7px;border-radius:2px}
.list-label{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.24em;color:var(--side-dim);padding:14px 20px 6px}
.sb-list{flex:1;overflow-y:auto;padding:0 10px 12px}
.sb-empty{font-family:var(--f-mono);font-size:10.5px;color:var(--side-dim);padding:16px 12px;line-height:1.7}
.doc-item{padding:11px 12px;border-left:2px solid transparent;cursor:pointer;border-radius:2px;transition:.15s}
.doc-item:hover{background:rgba(239,234,217,.05)}
.doc-item.active{background:rgba(239,234,217,.08);border-left-color:var(--acc-bright)}
.doc-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.doc-idx{font-family:var(--f-mono);font-size:9.5px;color:var(--side-dim);flex:none}
.doc-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-meta{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.07em;color:var(--side-dim);margin-top:4px}

.dg-label{font-family:var(--f-mono);font-size:8px;letter-spacing:.24em;color:var(--side-dim);margin-top:11px}
.dg-strip{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.dg-chip{width:58px;padding:4px 4px 3px;border:1px solid var(--side-line);background:rgba(239,234,217,.03);cursor:pointer;transition:.15s;border-radius:2px}
.dg-chip:hover{border-color:var(--acc-bright);background:rgba(239,234,217,.08)}
.dg-chip svg{width:100%;height:auto;display:block}
.dg-cards{display:flex;flex-direction:column;gap:7px;margin-top:7px}
.dg-card{border:1px solid var(--side-line);background:rgba(239,234,217,.04);padding:9px 10px 7px;cursor:pointer;text-align:left;width:100%;transition:.15s;border-radius:2px}
.dg-card:hover{border-color:var(--acc-bright)}
.dg-card svg{width:100%;height:84px;display:block}
.dg-card .dg-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:7px;font-family:var(--f-mono)}
.dg-card .dg-name{font-size:10.5px;color:var(--side-ink);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg-card .dg-conf{font-size:9px;color:var(--acc-bright);flex:none}
.dg-empty{font-family:var(--f-mono);font-size:9.5px;color:var(--side-dim);margin-top:8px;line-height:1.6}
.dg-more{display:block;width:100%;background:none;border:1px dashed var(--side-line);color:var(--side-dim);
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;padding:7px 0;cursor:pointer;transition:.15s;border-radius:2px}
.dg-more:hover{border-color:var(--acc-bright);color:var(--side-ink)}
.dg-more-mini{width:auto;padding:3px 7px;border:1px dashed var(--side-line);color:var(--side-dim);
  font-family:var(--f-mono);font-size:9px;display:flex;align-items:center;border-radius:2px}
.dg-flash{animation:dgFlash 1.5s}
@keyframes dgFlash{0%,55%{border-color:var(--acc-bright);box-shadow:0 0 0 1px var(--acc-bright)}}

.sb-foot{border-top:1px solid var(--side-line);padding:13px 16px 15px}
.st-row{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.18em;color:var(--side-dim)}
.st-track{height:3px;background:rgba(239,234,217,.12);margin-top:8px}
.st-fill{height:100%;background:var(--acc-bright);width:0;transition:width .4s}
.foot-btns{display:flex;gap:8px;margin-top:12px}
.foot-btns button{flex:1;background:none;border:1px solid var(--side-line);color:var(--side-dim);
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:7px 0;cursor:pointer;transition:.15s}
.foot-btns button:hover{border-color:var(--side-ink);color:var(--side-ink)}

/* ============ MAIN ============ */
#main{flex:1;overflow-y:auto;position:relative;
  background-image:radial-gradient(rgba(25,21,16,.075) 1px,transparent 1.3px);background-size:23px 23px}
.view{max-width:960px;margin:0 auto;padding:52px 56px 100px;animation:viewIn .5s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(16px)}}
@keyframes spin{to{transform:rotate(360deg)}}

.kicker{font-family:var(--f-mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--acc)}
.title{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1.06;margin-top:12px;overflow-wrap:anywhere}
.meta-line{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink-3);margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meta-line i{font-style:normal;color:var(--line-2)}
.doc-actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;border:1px solid var(--ink);background:transparent;padding:10px 16px;cursor:pointer;transition:.15s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:#000}
.btn.danger{border-color:var(--acc);color:var(--acc)}
.btn.danger:hover{background:var(--acc);color:var(--paper)}
.btn:disabled{opacity:.4;pointer-events:none}

.sec-head{display:flex;align-items:baseline;gap:14px;margin:54px 0 8px}
.sec-title{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2)}
.sec-count{font-family:var(--f-mono);font-size:10px;color:var(--ink-3)}
.rule{flex:1;height:1px;background:var(--line)}
.sec-note{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink-3);margin-bottom:4px}

.skyline{display:flex;align-items:flex-end;gap:12px;margin-top:36px;border-bottom:1px solid var(--line)}
.sky-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;min-width:0}
.sky-val{font-family:var(--f-mono);font-size:9.5px;color:var(--ink-2)}
.sky-bar{width:100%;max-width:54px}
.sky-lab{font-family:var(--f-mono);font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
  text-align:center;line-height:1.35;height:24px;overflow:hidden;margin-top:4px}
.sky-col:first-child .sky-bar{background:var(--acc)}
.sky-col:first-child .sky-val{color:var(--acc)}

.plist{margin-top:16px;border-top:1px solid var(--line)}
.prow{border-bottom:1px solid var(--line)}
.prow-head{display:flex;align-items:center;gap:16px;padding:17px 4px;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.rank{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);width:28px;flex:none}
.prow-name{font-size:17px;font-weight:600;display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;min-width:0}
.cat-tag{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--line-2);color:var(--ink-3);padding:3px 8px;border-radius:2px;white-space:nowrap}
.prow-chips{margin-left:auto;display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden}
.sig-chip{font-family:var(--f-mono);font-size:9.5px;background:var(--paper-2);border:1px solid var(--line);
  padding:3px 8px;color:var(--ink-2);white-space:nowrap}
.sig-chip b{color:var(--acc);font-weight:600}
.chev{color:var(--ink-3);transition:transform .25s;flex:none}
.prow.open .chev{transform:rotate(180deg)}
.prow-body{overflow:hidden;max-height:0;transition:max-height .38s cubic-bezier(.2,.7,.2,1)}
.prow-inner{padding:2px 4px 24px 44px}
.p-top{display:flex;gap:26px;align-items:flex-start}
.p-copy{flex:1;min-width:0}
.p-diagram{flex:none;width:230px;border:1px solid var(--line);background:var(--card);padding:12px}
.p-diagram svg{width:100%;height:auto}
.p-diagram .dg-cap{font-family:var(--f-mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:9px;text-align:center}
.atlas-dg{width:210px;margin:14px 0 4px}
.p-desc{font-size:14.5px;color:var(--ink-2);line-height:1.55;max-width:64ch}
.ev-list{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.ev{border-left:2px solid var(--acc);padding:5px 0 5px 16px;font-family:var(--f-serif);font-style:italic;
  font-size:15.5px;color:#2B261D;line-height:1.62}
mark{background:var(--acc-soft);color:inherit;border-bottom:1.5px solid var(--acc);padding:0 1px}
mark.flash{animation:flash 1.1s}
@keyframes flash{0%{background:var(--acc);color:var(--paper)}}

.ana{margin-top:14px;border:1px dashed var(--line-2);background:rgba(234,230,216,.42);padding:12px 15px;display:flex;gap:11px;align-items:flex-start}
.ana-ic{color:var(--acc);margin-top:3px;flex:none}
.ana-tag{font-family:var(--f-mono);font-size:8px;letter-spacing:.22em;color:var(--acc)}
.ana-txt{font-size:14px;color:var(--ink-2);line-height:1.6;margin-top:4px}

/* ============ KNOWLEDGE RADAR (inline) ============ */
.radar{margin-top:16px;border-top:1px dashed var(--line-2);padding-top:11px}
.radar-lab{font-family:var(--f-mono);font-size:8px;letter-spacing:.22em;color:var(--ink-3)}
.radar-lab2{font-family:var(--f-mono);font-size:8px;letter-spacing:.18em;color:var(--ink-3);margin-right:2px}
.radar-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.rlink{font-family:var(--f-mono);font-size:10px;border:1px solid var(--line-2);padding:4px 9px;color:var(--ink-2);
  text-decoration:none;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.rlink:hover{border-color:var(--acc);color:var(--acc)}
.rlx{opacity:.55;font-size:9px}
.xrwrap{display:inline-flex;align-items:center}
.xdel{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:12px;padding:0 1px;margin-left:-4px;line-height:1}
.xdel:hover{color:var(--acc)}
.wbtn{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;border:1px dashed var(--acc);color:var(--acc);background:none;padding:4px 10px;cursor:pointer;transition:.15s}
.wbtn:hover{background:var(--acc);color:var(--paper)}
.wslot:empty{display:none}
.wcard{margin-top:10px;border:1px solid var(--line);background:var(--card);padding:13px 15px}
.wcard .wsrc{font-family:var(--f-mono);font-size:8px;letter-spacing:.2em;color:var(--acc)}
.wcard .wx{font-family:var(--f-serif);font-size:14.5px;line-height:1.65;color:var(--ink-2);margin:7px 0 11px}
.wload{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.wmiss{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rinput{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line-2);font-family:var(--f-mono);
  font-size:10.5px;padding:5px 8px;color:var(--ink)}
.rinput::placeholder{color:var(--ink-3)}
.rinput:focus{outline:none;border-color:var(--acc)}
.rselect{background:var(--card);border:1px solid var(--line-2);font-family:var(--f-mono);font-size:10px;
  padding:5px 6px;color:var(--ink);max-width:190px}

/* ============ GRAPH MODEL ============ */
.gmodel{margin-top:26px;border:1px solid var(--line);background:var(--card);padding:16px 18px 14px}
.ghead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.gtitle{font-size:15px;font-weight:600}
.gsub{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;color:var(--ink-3)}
.gsvg{width:100%;height:auto;display:block;margin-top:8px}
.gedge{stroke:var(--line-2);stroke-width:1.1;transition:.15s}
.gsvg.dim .gedge{stroke-opacity:.15}
.gedge.lit{stroke:var(--acc);stroke-opacity:1}
.gnode{cursor:pointer;transition:opacity .15s}
.gsvg.dim .gnode.dim{opacity:.16}
.gnode text{font-family:var(--f-mono);font-size:9px;fill:var(--ink-2);pointer-events:none}
.gnode:hover text{fill:var(--ink)}
.gcap{font-family:var(--f-mono);font-size:9.5px;color:var(--ink-3);margin-top:8px;line-height:1.7}

.duo{display:grid;grid-template-columns:1.15fr .9fr;gap:60px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);padding:5px 11px;color:var(--ink-2)}
.chip b{color:var(--acc);font-weight:600;margin-left:5px}
.conc{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.conc-row{display:grid;grid-template-columns:minmax(80px,170px) 1fr 36px;align-items:center;gap:12px}
.conc-term{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conc-track{height:5px;background:var(--paper-2)}
.conc-fill{height:100%;background:var(--ink)}
.conc-row:first-child .conc-fill,.conc-row.acc .conc-fill{background:var(--acc)}
.conc-n{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);text-align:right}

.reader-wrap{margin-top:18px;border:1px solid var(--line);background:var(--card)}
.reader-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.reader-bar .sp{flex:1}
.pg-btn{border:1px solid var(--line-2);background:none;width:26px;height:26px;display:grid;place-items:center;cursor:pointer;transition:.15s}
.pg-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.reader-body{max-height:460px;overflow-y:auto;padding:26px 30px;font-family:var(--f-serif);font-size:15.5px;line-height:1.78;color:#343026}
.reader-body p{margin:0 0 1em}

/* ============ HOME ============ */
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 30px}
.bp{width:min(560px,82%);height:auto}
.bp .st{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round}
.bp .st-acc{stroke:var(--acc)}
.bp .dash{stroke-dasharray:4 4;stroke:var(--ink-3);stroke-width:1}
.bp .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.45,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bp text{font-family:var(--f-mono);font-size:8px;letter-spacing:.13em;fill:var(--ink-3);opacity:0;animation:fadeIn .5s forwards}
.bp text.acc{fill:var(--acc)}
.bp .fadein{opacity:0;animation:fadeIn .6s forwards}
@keyframes fadeIn{to{opacity:1}}
.home-h{font-size:clamp(32px,4.6vw,50px);font-weight:600;letter-spacing:-.022em;line-height:1.05;margin-top:34px;max-width:16ch}
.home-h em{font-style:normal;color:var(--acc)}
.home-sub{font-size:15px;color:var(--ink-2);max-width:52ch;margin:18px auto 0;line-height:1.65}
.home-stats{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-bottom:26px}
.home-stats b{color:var(--acc);font-weight:600}
.drop{margin-top:36px;width:min(620px,94%);border:1.5px dashed var(--line-2);background:rgba(251,249,242,.55);
  padding:36px 26px;cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--card);transform:translateY(-2px)}
.drop-big{font-family:var(--f-mono);font-size:12px;letter-spacing:.28em;text-transform:uppercase}
.drop-big span{color:var(--acc)}
.drop-fmt{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.fmt{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;border:1px solid var(--line-2);padding:3px 9px;color:var(--ink-3)}
.fmt.hot{color:var(--acc);border-color:var(--acc-soft)}
.gh-bar{margin-top:14px;width:min(620px,94%);display:flex;align-items:stretch;border:1px solid var(--line-2);background:var(--card);transition:.2s}
.gh-bar:focus-within{border-color:var(--ink)}
.gh-ic{display:grid;place-items:center;padding-left:13px;color:var(--ink-3)}
.gh-bar input{flex:1;min-width:0;border:0;background:none;font-family:var(--f-mono);font-size:12px;color:var(--ink);padding:13px 12px}
.gh-bar input::placeholder{color:var(--ink-3)}
.gh-bar input:focus{outline:none}
.gh-btn{border:0;border-left:1px solid var(--line-2);background:var(--ink);color:var(--paper);font-family:var(--f-mono);
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:0 16px;cursor:pointer;transition:.15s;white-space:nowrap}
.gh-btn:hover{background:#000}
.gh-hint{font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;color:var(--ink-3);margin-top:10px;line-height:1.8;max-width:62ch}
.home-privacy{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-3);margin-top:22px}
.home-recent{margin-top:30px;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.home-recent button{background:none;border:0;border-bottom:1px solid var(--line-2);cursor:pointer;font-family:var(--f-mono);
  font-size:11px;color:var(--ink-2);padding-bottom:2px;transition:.15s}
.home-recent button:hover{color:var(--acc);border-color:var(--acc)}

/* ============ PROCESSING ============ */
.proc{max-width:640px;margin:0 auto;padding:76px 40px 120px}
.steps{margin-top:36px;border-top:1px solid var(--line)}
.step{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid var(--line);opacity:.32;transition:.3s}
.step.active,.step.done{opacity:1}
.step-state{width:18px;height:18px;display:grid;place-items:center;color:var(--ink-3)}
.step.active .step-state{color:var(--ink)}
.step.done .step-state{color:var(--acc)}
.step-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.step-result{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);text-align:right}
.sig-cloud{display:flex;flex-wrap:wrap;gap:7px;margin-top:28px;min-height:34px}
.sig-cloud .sig-chip{animation:pop .28s both}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
.mp-wrap{margin-top:26px}
.mp{display:grid;grid-template-columns:56px minmax(96px,150px) 1fr 42px;gap:12px;align-items:center;padding:8px 0;animation:pop .3s both}
.mp-dg svg{width:100%;height:auto;display:block}
.mp-name{font-family:var(--f-mono);font-size:11px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-track{height:4px;background:var(--paper-2)}
.mp-fill{height:100%;background:var(--acc);width:0;transition:width .55s cubic-bezier(.2,.7,.2,1)}
.mp-val{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);text-align:right}
.proc-note{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--acc);margin-top:22px;min-height:14px}

/* ============ ATLAS / RECALL ============ */
.catfilter{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.cf-chip{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:7px 13px;
  border:1px solid var(--line-2);background:none;cursor:pointer;transition:.15s;color:var(--ink-2)}
.cf-chip:hover{border-color:var(--ink)}
.cf-chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.arow-dg{flex:none;width:50px}
.arow-dg svg{width:100%;height:auto;display:block}
.arow-head .prow-name{font-size:16px}
.arow-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.arow-n{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);white-space:nowrap}
.arow-meter{width:88px;height:4px;background:var(--paper-2)}
.arow-meter div{height:100%;background:var(--acc)}
.dormant{margin-top:44px;padding-top:18px;border-top:1px solid var(--line)}
.dormant p{font-family:var(--f-mono);font-size:10.5px;line-height:2.1;color:var(--ink-3);letter-spacing:.04em}
.doc-chip{font-family:var(--f-mono);font-size:10px;border:1px solid var(--line-2);background:none;cursor:pointer;
  padding:5px 10px;color:var(--ink-2);transition:.15s;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-chip:hover{border-color:var(--acc);color:var(--acc)}

.scope-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.panel{margin-top:30px;border:1px solid var(--line);background:var(--card);padding:30px 32px}
.panel-big{font-size:26px;font-weight:600;letter-spacing:-.01em}
.panel-sub{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.05em;margin-top:10px;line-height:1.8}
.panel-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.mrow{display:flex;align-items:center;gap:14px;padding:11px 2px;border-bottom:1px solid var(--line)}
.mrow-name{font-size:14.5px;font-weight:500}
.mrow-doc{font-family:var(--f-mono);font-size:9px;color:var(--ink-3);letter-spacing:.05em;margin-top:2px}
.mrow-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.boxes{display:flex;gap:4px}
.bx{width:13px;height:13px;border:1px solid var(--line-2)}
.bx.on{background:var(--acc);border-color:var(--acc)}
.box-lab{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);width:70px;text-align:right}

.qcard{margin-top:30px;border:1px solid var(--ink);background:var(--card);padding:32px 34px;box-shadow:7px 7px 0 rgba(25,21,16,.08)}
.q-quote{font-family:var(--f-serif);font-style:italic;font-size:17.5px;line-height:1.65;color:#2B261D;margin-top:18px}
.q-opts{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;padding:13px 16px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-size:15px;transition:.15s}
.opt .opt-key{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);border:1px solid var(--line-2);width:22px;height:22px;display:grid;place-items:center;flex:none}
.opt .opt-dg{width:44px;flex:none}
.opt .opt-dg svg{width:100%;height:auto;display:block}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.correct{border-color:var(--acc);background:var(--acc-soft)}
.opt.correct .opt-key{background:var(--acc);border-color:var(--acc);color:var(--paper)}

@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.q-feedback{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;display:flex;gap:18px;align-items:flex-start}
.q-fb-copy{flex:1;min-width:0}
.q-fb-dg{width:96px;flex:none;border:1px dashed var(--line-2);padding:6px;background:rgba(234,230,216,.42)}
.q-fb-dg svg{width:100%;height:auto;display:block}
.q-fb-name{font-size:16px;font-weight:600}
.q-fb-name.ok{color:var(--acc)}
.q-fb-desc{font-size:14px;color:var(--ink-2);line-height:1.55;margin-top:6px;max-width:62ch}
.q-fb-box{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-top:12px}
.q-foot{display:flex;justify-content:flex-end;margin-top:24px}
.qresult{text-align:center;padding:14px 0 4px}
.qresult .big{font-size:44px;font-weight:600;letter-spacing:-.02em;margin-top:16px}
.qresult .sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:10px}
.qresult .panel-actions{justify-content:center}

/* toasts / drop overlay */
#toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:10px;z-index:200}
.toast{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--ink);color:var(--ink);
  padding:13px 16px;font-family:var(--f-mono);font-size:11.5px;line-height:1.55;max-width:380px;
  box-shadow:5px 5px 0 rgba(25,21,16,.12);animation:pop .3s;transition:opacity .3s,transform .3s}
.toast .t-ic{color:var(--acc);margin-top:1px}
#dropover{position:fixed;inset:0;z-index:150;display:none;background:rgba(244,241,232,.92);backdrop-filter:blur(3px)}
#dropover.on{display:block}
#dropover .frame{position:absolute;inset:16px;border:2px dashed var(--acc);display:grid;place-items:center}
#dropover .in{text-align:center}
#dropover .big{font-family:var(--f-mono);font-size:clamp(18px,3vw,30px);letter-spacing:.3em;text-transform:uppercase;color:var(--acc)}
#dropover .small{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);margin-top:14px}

.mobile-bar{display:none;position:fixed;top:0;left:0;right:0;height:52px;background:var(--side);color:var(--side-ink);
  z-index:60;align-items:center;padding:0 14px;gap:14px;border-bottom:1px solid #000}
.mobile-bar .wordmark{font-size:11px;letter-spacing:.16em}
.mobile-bar button{background:none;border:0;color:var(--side-ink);cursor:pointer;display:grid;place-items:center;width:36px;height:36px}
.mobile-bar .add-m{margin-left:auto}

@media(max-width:920px){
  .mobile-bar{display:flex}
  #app{padding-top:52px}
  #sidebar{position:fixed;left:0;top:52px;bottom:0;transform:translateX(-100%);transition:transform .3s;box-shadow:10px 0 40px rgba(0,0,0,.4)}
  #sidebar.open{transform:none}
  .view{padding:34px 20px 90px}
  .duo{grid-template-columns:1fr;gap:44px}
  .title{font-size:30px}
  .prow-chips{display:none}
  .prow-inner{padding-left:4px}
  .p-top{flex-direction:column}
  .p-diagram{width:100%}
  .q-feedback{flex-direction:column}
  .q-fb-dg{width:130px}
  .home{padding-top:30px}
  .gh-btn span{display:none}
  .gh-btn{padding:0 13px}
}

.home{display:block;text-align:left;padding:0;min-height:100%}.hero{position:relative;background:#123c45;color:white;padding:54px clamp(24px,5vw,78px) 48px;overflow:hidden}.hero:after{content:'';position:absolute;width:330px;height:330px;border:70px solid rgba(60,194,195,.16);border-radius:50%;right:-200px;top:-150px;pointer-events:none}.hero-top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:40px}.hero-kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#a2dfe0}.hero-status{font-size:11px;color:#c1dcdf}.hero-status:before{content:'';display:inline-block;width:6px;height:6px;background:#97d97a;border-radius:50%;margin-right:8px}.home-h{font-size:clamp(38px,4.4vw,68px);font-weight:500;letter-spacing:-.045em;line-height:1.02;max-width:16ch;margin:0}.home-h em{color:#9de0db}.home-sub{font-size:16px;line-height:1.65;max-width:60ch;margin:24px 0 0;color:#d1e4e7}.hero-rule{display:flex;gap:4px;margin-top:34px;width:160px;height:5px}.hero-rule span{flex:1;background:#33b5ba}.hero-rule span:nth-child(2){background:#86c85b}.hero-rule span:nth-child(3){background:#f5a65b}.hero-rule span:nth-child(4){background:#d65c91}
.home-content{padding:34px clamp(24px,5vw,78px) 46px;max-width:1240px}.capture-heading{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px}.capture-heading h2{font-size:24px;letter-spacing:-.6px}.capture-heading span{font-size:11px;color:var(--ink-3)}.capture-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}.capture-card{background:white;border:1px solid var(--line);padding:24px;min-width:0}.capture-step{font-size:10px;text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:var(--acc);margin-bottom:15px}.drop{width:100%;margin:0;text-align:center;padding:26px 16px;border:1px dashed #80aeb3;background:#f4fafa;min-height:145px;display:flex;flex-direction:column;justify-content:center}.drop:hover,.drop.over{background:#e6f4f4;transform:none}.drop-big{font-size:15px;letter-spacing:0;text-transform:none;font-weight:700;line-height:1.5}.drop-big span{display:block;color:var(--ink-3);font-size:12px;font-weight:400}.drop-fmt{gap:5px;margin-top:15px}.fmt{font-size:9px;letter-spacing:.025em;padding:3px 5px;border-color:#cbdedf}.fmt.hot{color:#00636c;border-color:#b8d9da}.repo-label{font-size:17px;font-weight:700;line-height:1.3}.gh-bar{width:100%;margin-top:17px;border-color:#b9cccf;min-height:46px}.gh-bar input{font-size:12px;padding-left:8px}.gh-btn{background:var(--acc);padding:0 12px;letter-spacing:0;font-size:12px;text-transform:none;font-weight:700}.gh-btn:hover{background:var(--acc-deep)}.gh-hint{font-size:11px;line-height:1.6;margin-top:12px;letter-spacing:0;max-width:none}.home-privacy{font-size:11px;line-height:1.6;margin:18px 0 0;letter-spacing:0}.home-stats{margin:0 0 20px;color:#627a80;font-size:11px;letter-spacing:.05em}.home-recent{justify-content:flex-start;margin-top:22px;font-size:12px}.home-recent button{padding:8px;border:1px solid var(--line);background:white}.learning-benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:32px;padding-top:26px;border-top:1px solid var(- async function ensureReader(name, progress) {
  if (window[name]) return;
  if (readerLoads[name]) return readerLoads[name];
  readerLoads[name] = (async () => {
    for (const url of READERS[name]) {
      if (progress) progress('Loading ' + name + ' reader...');
      try {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          const timer = setTimeout(() => { script.remove(); reject(new Error('Reader download timed out')); }, 15000);
          script.src = url;
          script.onload = () => { clearTimeout(timer); window[name] ? resolve() : reject(new Error('Reader unavailable')); };
          script.onerror = () => { clearTimeout(timer); script.remove(); reject(new Error('Reader download blocked')); };
          document.head.appendChild(script);
        });
        if (name === 'pdfjsLib') window.pdfjsLib.GlobalWorkerOptions.workerSrc = url.replace('pdf.min.js', 'pdf.worker.min.js');
        return;
      } catch (error) { /* Try the alternate reader host. */ }
    }
    throw new Error('Could not download the ' + name + ' reader. Open this HTML in a full browser tab with internet access, then retry. TXT and Markdown work without downloads.');
  })();
  try { await readerLoads[name]; } finally { delete readerLoads[name]; }
}

function download(name, content, type) {
  const mime = (type || 'text/plain') + ';charset=utf-8';
  let inIframe = false;
  try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }
  const clickAnchor = href => {
    const a = document.createElement('a');
    a.href = href; a.download = name; a.rel = 'noopener';
    a.style.position = 'fixed'; a.style.top = '-1000px'; a.style.opacity = '0';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 1500);
  };
  try {
    const url = URL.createObjectURL(new Blob([content], { type: mime }));
    clickAnchor(url);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    if (inIframe) toast('File generated \u2014 if nothing downloaded, this preview sandbox may block downloads. Open the app in a full browser tab.');
    else toast('Exported \u201C' + name + '\u201D \u2014 check your Downloads folder.');
  } catch (e) {
    const rd = new FileReader();
    rd.onload = () => clickAnchor(rd.result);
    rd.readAsDataURL(new Blob([content], { type: mime }));
  }
}
function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<span class="t-ic">' + ic(type === 'error' ? 'alert' : 'check', 15) + '</span><span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 320); }, 4200);
}

/* ============================== TEXT HUMANIZER ============================== */
/* Converts messy extracted text (markdown syntax, curly quotes, em dashes,
   bullets, arrows, URLs, stray unicode) into plain simple English. */
function humanize(t) {
  return String(t)
    .replace(/```[^\n]*\n?([\s\S]*?)```/g, '$1')                 // code blocks
    .replace(/`([^`]*)`/g, '$1')                     // inline code
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')           // markdown images
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')         // markdown links -> their text
    .replace(/^#{1,6}\s+/gm, '')                     // heading hashes
    .replace(/^\s*([-*_]\s*){3,}$/gm, '')            // horizontal rules
    .replace(/^\s*>\s?/gm, '')                       // blockquote marks
    .replace(/\*\*([^*]+)\*\*/g, '$1')               // bold
    .replace(/\*([^*\n]+)\*/g, '$1')                 // italic
    .replace(/__([^_]+)__/g, '$1')                   // bold alt
    .replace(/https?:\/\/\S+/g, 'link')              // bare urls
    .replace(/[\u2018\u2019\u201B]/g, "'")           // curly quotes
    .replace(/[\u201C\u201D\u201E\u201F]/g, '"')
    .replace(/[\u2013\u2014\u2015]/g, ' - ')         // dashes
    .replace(/\u2026/g, '...')
    .replace(/\u2192/g, '->')
    .replace(/\u00D7/g, 'x')
    .replace(/[\u2022\u25CF\u25AA\u25E6\u2043\u00B7]/g, '-')  // bullets
    .replace(/[\u200B-\u200D\uFEFF\u00A0]/g, ' ')    // zero-width & nbsp
    .replace(/\|/g, ' ')                             // markdown table pipes
    .replace(/[^\x09\x0A\x20-\x7E]/g, ' ')           // any remaining non-ascii
    .replace(/[ \t]+/g, ' ')
    .replace(/ ?\n ?/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .replace(/ - - /g, ' - ')
    .trim();
}

async function wikiFetch(title) {
  const u = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=extracts&exintro=1&explaintext=1&titles=' + encodeURIComponent(title);
  const r = await fetch(u);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  const pages = Object.values((j.query && j.query.pages) || {});
  const pg = pages.find(p => p && !p.missing && p.extract);
  if (!pg) return null;
  return {
    title: pg.title,
    extract: pg.extract.replace(/\s+/g, ' ').trim().slice(0, 420),
    url: 'https://en.wikipedia.org/wiki/' + encodeURIComponent(pg.title.replace(/ /g, '_'))
  };
}
async function wikiPull(pid) {
  const slot = document.getElementById('wslot-' + pid);
  if (!slot || slot.dataset.busy) return;
  slot.dataset.busy = '1';
  const title = WIKITITLE[pid] || LIBMAP[pid].name;
  const q = encodeURIComponent(title);
  slot.innerHTML = '<div class="wcard"><span class="wload">' + SPIN + ' pulling from Wikipedia\u2026</span></div>';
  try {
    let w = WIKI_CACHE[pid];
    if (!w) { w = await wikiFetch(title); if (w) { WIKI_CACHE[pid] = w; saveJSON(WKEY, WIKI_CACHE); } }
    if (!w) {
      slot.innerHTML = '<div class="wcard wmiss">No direct Wikipedia article \u2014 <a class="rlink" target="_blank" rel="noopener" href="https://en.wikipedia.org/w/index.php?search=' + q + '">search Wikipedia \u2197</a></div>';
    } else {
      slot.innerHTML = '<div class="wcard"><div class="wsrc">WIKIPEDIA \u00B7 ' + esc(w.title) + '</div>' +
        '<p class="wx">' + esc(humanize(w.extract)) + '...</p>' +
        '<a class="rlink" target="_blank" rel="noopener" href="' + esc(w.url) + '">Continue on Wikipedia <span class="rlx">\u2197</span></a></div>';
    }
  } catch (e) {
    slot.innerHTML = '<div class="wcard wmiss">Fetch blocked or offline \u2014 <a class="rlink" target="_blank" rel="noopener" href="https://en.wikipedia.org/w/index.php?search=' + q + '">open on Wikipedia \u2197</a></div>';
  }
  slot.dataset.busy = '';
}

/* ============================== DIAGRAM ENGINE ============================== */
const DGR = (x, y, w, h, o) => { o = o || {}; return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (o.rx != null ? o.rx : 2) + '" class="dg-b ' + (o.c || '') + '"/>'; };
const DGT = (x, y, s, o) => { o = o || {}; return '<text x="' + x + '" y="' + y + '" text-anchor="' + (o.a || 'middle') + '" class="dg-t ' + (o.c || '') + '">' + s + '</text>'; };
const DGL = (x1, y1, x2, y2, c) => '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" class="' + (c || 'dg-b') + '"/>';
function DGA(x1, y1, x2, y2, c) {
  const ang = Math.atan2(y2 - y1, x2 - x1), s = 3.4, a1 = ang + 2.5, a2 = ang - 2.5;
  return DGL(x1, y1, x2, y2, c) +
    '<path d="M' + (x2 + s * Math.cos(a1)).toFixed(1) + ' ' + (y2 + s * Math.sin(a1)).toFixed(1) + ' L' + x2 + ' ' + y2 + ' L' + (x2 + s * Math.cos(a2)).toFixed(1) + ' ' + (y2 + s * Math.sin(a2)).toFixed(1) + '" class="' + (c || 'dg-b') + '"/>';
}
const DGD = (x, y, r, c) => '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" class="dg-b ' + (c || '') + '"/>';
const DGDot = (x, y, c) => '<circle cx="' + x + '" cy="' + y + '" r="1.7" class="' + (c || 'dg-f') + '"/>';
function DGCyl(x, y, w, h, c) {
  const ry = Math.min(4, w * 0.22);
  return '<ellipse cx="' + (x + w / 2) + '" cy="' + (y + ry) + '" rx="' + (w / 2) + '" ry="' + ry + '" class="dg-b ' + (c || '') + '"/>' +
    '<path d="M' + x + ' ' + (y + ry) + ' v' + (h - 2 * ry) + ' a' + (w / 2) + ' ' + ry + ' 0 0 0 ' + w + ' 0 v' + (-(h - 2 * ry)) + '" class="dg-b ' + (c || '') + '"/>';
}
function DGQ(x, y, w, h, c) {
  let s = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (h / 2) + '" class="dg-b ' + (c || '') + '"/>';
  for (let i = x + 8; i < x + w - 3; i += 7) s += DGL(i, y + 2, i, y + h - 2, 'dg-h');
  return s;
}

/* ============================== ANALYSIS ENGINE ============================== */
function splitSentences(text) {
  const spans = []; let a = 0;
  const flush = b => { if (b > a) spans.push({ a, b }); a = b; };
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if ((c === '.' || c === '!' || c === '?') && (i + 1 >= text.length || text[i + 1] === ' ' || text[i + 1] === '\n')) flush(i + 1);
  }
  flush(text.length);
  const merged = [];
  for (const s of spans) {
    const p = merged[merged.length - 1];
    if (p && s.b - s.a < 25) { p.b = s.b; continue; }
    merged.push({ a: s.a, b: s.b });
  }
  const out = [];
  for (const s of merged) {
    let seg = s.a;
    while (s.b - seg > 480) {
      let cut = text.lastIndexOf(' ', seg + 420);
      if (cut <= seg + 100) cut = seg + 420;
      out.push({ a: seg, b: cut }); seg = cut;
    }
    out.push({ a: seg, b: s.b });
  }
  return out.map(sp => ({ t: text.slice(sp.a, sp.b).replace(/\s+/g, ' ').trim(), a: sp.a, b: sp.b }))
            .filter(x => x.t.length >= 20).slice(0, 6000);
}

function analyze(text) {
  const S = splitSentences(text);
  const hits = [];
  const cre = new RegExp('(?:' + COMBINED_SRC + ')', 'gi');
  let m;
  while ((m = cre.exec(text))) { if (m[0].length) hits.push({ i: m.index, s: m[0] }); else cre.lastIndex++; }

  const st = LIB.map(() => ({ raw: 0, terms: new Map(), sentHits: new Map() }));
  const allTerms = new Map(), hlSet = new Set();
  let sp = 0, hitCount = 0;
  const sentOf = i => { while (sp < S.length - 1 && i >= S[sp].b) sp++; return sp; };

  for (const h of hits) {
    let attributed = false; const l = h.s.toLowerCase();
    for (let pi = 0; pi < LIB.length; pi++) {
      let any = false;
      for (const sg of LIB[pi].sigs) if (sg.rt.test(h.s)) { st[pi].raw += sg.w; any = true; }
      if (any) {
        attributed = true;
        const tm = st[pi].terms; tm.set(l, (tm.get(l) || 0) + 1);
        const si = sentOf(h.i);
        let set = st[pi].sentHits.get(si);
        if (!set) { set = new Set(); st[pi].sentHits.set(si, set); }
        set.add(l);
      }
    }
    if (attributed) { hitCount++; allTerms.set(l, (allTerms.get(l) || 0) + 1); hlSet.add(l); }
  }

  const techs = [];
  for (const t of TECHS) {
    const mm = text.match(t.re);
    if (mm && mm.length) { techs.push({ name: t.name, n: mm.length }); hlSet.add(mm[0].toLowerCase()); }
  }
  techs.sort((a, b) => b.n - a.n);

  const patterns = [];
  for (let pi = 0; pi < LIB.length; pi++) {
    if (st[pi].raw < 2) continue;
    const conf = Math.min(0.97, 1 - Math.exp(-st[pi].raw / 9));
    const cands = [...st[pi].sentHits.entries()].map(([si, terms]) => {
      const s = S[si]; if (!s) return null;
      let score = 0;
      for (const sg of LIB[pi].sigs) if (sg.rt.test(s.t)) score += sg.w;
      score += Math.min(3, terms.size) * 0.5;
      return { si, score, terms: [...terms] };
    }).filter(Boolean).sort((a, b) => b.score - a.score);
    const ev = []; const seen = new Set();
    for (const c of cands) {
      const key = c.terms.join('|') + c.si;
      if (seen.has(key)) continue; seen.add(key);
      ev.push({ q: S[c.si].t.slice(0, 320), terms: c.terms });
      if (ev.length >= 3) break;
    }
    patterns.push({
      id: LIB[pi].id, score: Math.round(st[pi].raw), conf: +conf.toFixed(3),
      terms: [...st[pi].terms.entries()].map(x => ({ t: x[0], n: x[1] })).sort((a, b) => b.n - a.n).slice(0, 6),
      evidence: ev, box: 0, lastSeen: 0
    });
  }
  patterns.sort((a, b) => b.score - a.score);

  const hilite = [...hlSet].filter(t => t.length >= 3).sort((a, b) => b.length - a.length).slice(0, 380);

  const toks = (text.toLowerCase().match(/[a-z][a-z0-9&'-]{1,18}/g) || [])
    .map(w => w.replace(/^['&-]+|['&.-]+$/g, '')).filter(w => w.length > 2 && !/^\d+$/.test(w));
  const pass = w => w.length > 2 && !STOP.has(w) && !TECHSET.has(w);
  const freq = new Map();
  for (const w of toks) if (pass(w)) freq.set(w, (freq.get(w) || 0) + 1);
  let terms = [...freq.entries()].filter(x => x[1] >= 2).sort((a, b) => b[1] - a[1]).slice(0, 8);
  if (terms.length < 4) terms = [...freq.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6);
  const bg = new Map();
  for (let i = 0; i < toks.length - 1; i++) {
    if (pass(toks[i]) && pass(toks[i + 1])) {
      const k = toks[i] + ' ' + toks[i + 1];
      bg.set(k, (bg.get(k) || 0) + 1);
    }
  }
  const phrases = [...bg.entries()].filter(x => x[1] >= 2).sort((a, b) => b[1] - a[1]).slice(0, 6);

  const words = (text.match(/\S+/g) || []).length;
  return {
    patterns,
    techs: techs.slice(0, 18),
    concepts: { phrases, terms },
    topTerms: [...allTerms.entries()].map(x => ({ t: x[0], n: x[1] })).sort((a, b) => b.n - a.n).slice(0, 12),
    hilite,
    stats: { chars: text.length, words, hits: hitCount }
  };
}

function markFactory(terms) {
  if (!terms || !terms.length) return t => esc(t);
  const re = new RegExp('(' + terms.slice().sort((a, b) => b.length - a.length).map(escRe).join('|') + ')', 'gi');
  return t => esc(t).replace(re, '<mark>$1</mark>');
}

try {
  let raw = localStorage.getItem(KEY);
  if (!raw) for (const lk of LEGACY_KEYS) { raw = localStorage.getItem(lk); if (raw) break; }
  if (raw) store = JSON.parse(raw);
} catch (e) {}
let quotaWarned = false;

function saveStore() {
  const attempt = trunc => {
    const data = { v: 1, docs: store.docs.map(d => trunc && d.text && d.text.length > trunc ? Object.assign({}, d, { text: d.text.slice(0, trunc), truncated: true }) : d) };
    localStorage.setItem(KEY, JSON.stringify(data));
  };
  try { attempt(0); }
  catch (e) {
    try { attempt(40000); }
    catch (e2) {
      try { attempt(8000); }
      catch (e3) {
        if (!quotaWarned) { toast('Browser storage is full - captures are kept for this session only.', 'error'); quotaWarned = true; }
      }
    }
  }
}
const getDoc = id => store.docs.find(d => d.id === id);
const isDue = p => (Date.now() - p.lastSeen) / 864e5 >= INTERVALS[p.box];
function dueAll() { let n = 0; for (const d of store.docs) for (const p of d.analysis.patterns) if (isDue(p)) n++; return n; }

/* aggregate detected patterns across a scope - shared by Atlas + graph model */
function radarAgg(scope) {
  const docs = scope === 'all' ? store.docs : store.docs.filter(d => d.id === scope);
  const m = new Map();
  for (const d of docs) for (const p of d.analysis.patterns) {
    let e = m.get(p.id);
    if (!e) { e = { score: 0, docs: [], best: null }; m.set(p.id, e); }
    e.score += p.score;
    e.docs.push({ id: d.id, name: d.name, conf: p.conf });
    if (!e.best || p.conf > e.best.conf) e.best = { conf: p.conf, ev: p.evidence[0], doc: d.name };
  }
  return m;
}

/* ============================== GRAPH MODEL ============================== */
function gLayout(ns, es) {
  const W = 640, H = 330, cx = W / 2, cy = H / 2;
  ns.forEach((n, i) => {
    const a = (i / ns.length) * Math.PI * 2 + 0.45;
    n.x = cx + Math.cos(a) * W * 0.30; n.y = cy + Math.sin(a) * H * 0.32; n.vx = 0; n.vy = 0;
  });
  for (let it = 0; it < 150; it++) {
    for (let i = 0; i < ns.length; i++) for (let j = i + 1; j < ns.length; j++) {
      const A = ns[i], B = ns[j];
      let dx = A.x - B.x, dy = A.y - B.y;
      let d2 = dx * dx + dy * dy; if (d2 < 1) d2 = 1;
      const d = Math.sqrt(d2), f = 2800 / d2;
      dx /= d; dy /= d;
      A.vx += dx * f; A.vy += dy * f; B.vx -= dx * f; B.vy -= dy * f;
    }
    es.forEach(e => {
      const A = e.A, B = e.B;
      let dx = B.x - A.x, dy = B.y - A.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = (d - 125) * 0.02;
      dx /= d; dy /= d;
      A.vx += dx * f; A.vy += dy * f; B.vx -= dx * f; B.vy -= dy * f;
    });
    ns.forEach(n => {
      n.vx += (cx - n.x) * 0.004; n.vy += (cy - n.y) * 0.004;
      n.vx *= 0.86; n.vy *= 0.86;
      n.x += n.vx; n.y += n.vy;
      n.x = Math.max(72, Math.min(W - 72, n.x));
      n.y = Math.max(44, Math.min(H - 36, n.y));
    });
  }
}
function graphHover(pid) {
  const svg = $('#gsvg'); if (!svg) return;
  if (!pid) {
    svg.classList.remove('dim');
    svg.querySelectorAll('.gnode.dim').forEach(x => x.classList.remove('dim'));
    svg.querySelectorAll('.gedge.lit').forEach(x => x.classList.remove('lit'));
    return;
  }
  svg.classList.add('dim');
  svg.querySelectorAll('.gnode').forEach(n => n.classList.toggle('dim', n.dataset.pid !== pid));
  svg.querySelectorAll('.gedge').forEach(e => e.classList.toggle('lit', e.dataset.a === pid || e.dataset.b === pid));
}
function graphModelHTML(pats) {
  if (!pats || pats.length < 2) return '';
  const det = pats.slice(0, 12);
  const detSet = new Set(det.map(p => p.id));
  const ctxIds = [];
  for (const [a, b] of EDGES) {
    if (ctxIds.length >= 5) break;
    const inA = detSet.has(a), inB = detSet.has(b);
    if (inA !== inB) {
      const other = inA ? b : a;
      if (!detSet.has(other) && !ctxIds.includes(other)) ctxIds.push(other);
    }
  }
  const nodes = det.map(p => ({ id: p.id, conf: p.conf, ctx: false }))
    .concat(ctxIds.map(id => ({ id, conf: 0, ctx: true })));
  const map = {}; nodes.forEach(n => map[n.id] = n);
  const es = EDGES.filter(([a, b]) => map[a] && map[b]).map(([a, b]) => ({ a, b, A: map[a], B: map[b] }));
  gLayout(nodes, es);
  const cats = [...new Set(det.map(p => LIBMAP[p.id].cat))];
  let s = '<svg id="gsvg" class="gsvg" viewBox="0 0 640 330" role="img">';
  es.forEach(e => {
    s += '<line class="gedge" data-a="' + e.a + '" data-b="' + e.b + '" x1="' + e.A.x.toFixed(1) + '" y1="' + e.A.y.toFixed(1) + '" x2="' + e.B.x.toFixed(1) + '" y2="' + e.B.y.toFixed(1) + '"/>';
  });
  nodes.forEach(n => {
    const lib = LIBMAP[n.id];
    const r = n.ctx ? 5 : 7 + Math.round(n.conf * 5);
    const col = n.ctx ? 'var(--line-2)' : (CATCOL[lib.cat] || '#544D3D');
    const lab = lib.name.length > 20 ? lib.name.slice(0, 19) + '...' : lib.name;
    s += '<g class="gnode" data-pid="' + n.id + '"><title>' + esc(lib.name) + (n.ctx ? ' (related, not in this document)' : '') + '</title>' +
      '<circle cx="' + n.x.toFixed(1) + '" cy="' + n.y.toFixed(1) + '" r="' + r + '" fill="' + (n.ctx ? 'var(--card)' : col) + '" stroke="' + col + '" stroke-width="' + (n.ctx ? 1 : 1.4) + '"' + (n.ctx ? ' stroke-dasharray="2.5 2.5"' : '') + '/>' +
      '<text x="' + n.x.toFixed(1) + '" y="' + (n.y + r + 11).toFixed(1) + '" text-anchor="middle">' + esc(lab) + '</text></g>';
  });
  s += '</svg>';
  return '<div class="gmodel"><div class="ghead"><span class="gtitle">Graph model</span>' +
    '<span class="gsub">' + det.length + ' DETECTED NODES \u00B7 ' + es.length + ' RELATIONSHIP EDGES' + (ctxIds.length ? ' \u00B7 ' + ctxIds.length + ' CONTEXT NODES' : '') + '</span></div>' +
    s +
    '<div class="radar-row" style="margin-top:10px">' + cats.map(c => '<span class="sig-chip" style="border-color:' + (CATCOL[c] || '#544D3D') + '55">' + esc(c) + '</span>').join('') + '</div>' +
    '<div class="gcap">Solid nodes are patterns detected in this artifact (size shows confidence). Dashed nodes are related patterns the document does NOT use - useful gaps to notice. Hover a node to trace its connections.</div></div>';
}

/* ============================== FILE HANDLING ============================== */
let queue = [], processing = false;
function handleFiles(fileList) {
  const files = [...fileList].filter(f => ACCEPT_EXT.has((f.name.split('.').pop() || '').toLowerCase()));
  if (!files.length) { toast('No supported files found - I read PDF, DOCX, PPTX, images (OCR), TXT, MD, HTML and RTF.', 'error'); return; }
  queue.push(...files);
  if (!processing) runQueue();
}
async function runQueue() {
  if (processing) return;
  processing = true;
  try {
    while (queue.length) {
      const file = queue.shift();
      try { await processOne(file); }
      catch (error) {
        showReadFailure(file, error);
      }
    }
  } finally { processing = false; }
}
function showReadFailure(file, error) {
  const message = 'Could not read "' + file.name + '": ' + (error.message || 'Unknown error');
  const note = $('#pNote');
  if (note) {
    note.textContent = message + ' ';
    const retry = document.createElement('button');
    retry.className = 'btn'; retry.textContent = 'Retry file';
    retry.onclick = () => handleFiles([file]); note.appendChild(retry);
  }
  toast(message, 'error');
}
function stripBinary(t) { return t.replace(/[^\x20-\x7E\n\r\t]/g, ' ').replace(/[ \t]+/g, ' '); }
function stripRtf(t) { return t.replace(/\\'([0-9a-f]{2})/gi, ' ').replace(/\\[a-z]+-?\d*\s?/gi, ' ').replace(/[{}]/g, ' ').replace(/\\\\/g, ''); }

const OCR_MAX_DIM = 2200;

async function imageToCanvas(file, maxDim) {
  let srcW, srcH, source;
  if (window.createImageBitmap) {
    const bmp = await createImageBitmap(file);
    srcW = bmp.width; srcH = bmp.height; source = bmp;
  } else {
    const url = URL.createObjectURL(file);
    try {
      source = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('unreadable image')); im.src = url; });
      srcW = source.naturalWidth || source.width; srcH = source.naturalHeight || source.height;
    } finally { setTimeout(() => URL.revokeObjectURL(url), 5000); }
  }
  const s = Math.min(1, maxDim / Math.max(srcW, srcH, 1));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(srcW * s)); c.height = Math.max(1, Math.round(srcH * s));
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(source, 0, 0, c.width, c.height);
  if (source.close) try { source.close(); } catch (e) {}
  return { canvas: c, w: srcW, h: srcH };
}

function linesToSentences(t) {
  return t.split(/[\r\n]+/).map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean)
          .map(s => /[.!?]$/.test(s) ? s : s + '.').join(' ');
}

const ocrLog = on => m => {
  if (!on || !m || !m.status) return;
  on(m.status === 'recognizing text' ? 'OCR \u00B7 ' + Math.round((m.progress || 0) * 100) + '%' : m.status.replace(/[_-]+/g, ' ') + '...');
};
async function makeOcrWorker(log) {
  if (!window.Tesseract) return 'off';
  try { return await Tesseract.createWorker('eng', 1, { logger: log }); }
  catch (e) { return 'fallback'; }
}
async function ocrOnce(src, w, log) {
  if (w && w !== 'off' && w !== 'fallback') { const r = await w.recognize(src); return (r.data && r.data.text) || ''; }
  const r = await Tesseract.recognize(src, 'eng', { logger: log });
  return (r.data && r.data.text) || '';
}
async function endOcrWorker(w) { if (w && w.terminate) try { await w.terminate(); } catch (e) {} }

function utf16Runs(buf, minRun) {
  const u8 = new Uint8Array(buf);
  let out = '', run = '';
  const flush = () => { if (run.replace(/\s+/g, '').length >= (minRun || 6)) out += run.replace(/\s+/g, ' ').trim() + '\n'; run = ''; };
  for (let i = 0; i + 1 < u8.length; i += 2) {
    const c = u8[i] | (u8[i + 1] << 8);
    const ok = (c >= 32 && c < 127) || c === 9 || c === 10 || c === 13;
    if (ok) run += String.fromCharCode(c); else flush();
  }
  flush();
  return out;
}

function xmlParagraphs(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const ps = doc.getElementsByTagName('a:p');
  const lines = [];
  for (let i = 0; i < ps.length; i++) {
    const ts = ps[i].getElementsByTagName('a:t');
    let s = '';
    for (let j = 0; j < ts.length; j++) s += ts[j].textContent || '';
    s = s.replace(/\s+/g, ' ').trim();
    if (s) lines.push(s);
  }
  return lines;
}
async function pptxToText(buf, onProgress) {
  if (!window.JSZip) throw new Error('PPTX engine failed to load (offline?)');
  const zip = await JSZip.loadAsync(buf);
  const num = n => +n.match(/(\d+)\.xml$/)[1];
  const slideNames = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a, b) => num(a) - num(b));
  let out = '', nSlides = 0;
  for (const n of slideNames) {
    const lines = xmlParagraphs(await zip.file(n).async('string'));
    if (lines.length) { out += linesToSentences(lines.join('\n')) + '\n\n'; nSlides++; }
    if (onProgress) onProgress('slide ' + (slideNames.indexOf(n) + 1) + ' / ' + slideNames.length);
  }
  const noteNames = Object.keys(zip.files).filter(n => /^ppt\/notesSlides\/notesSlide\d+\.xml$/.test(n)).sort((a, b) => num(a) - num(b));
  for (const n of noteNames) {
    const lines = xmlParagraphs(await zip.file(n).async('string'));
    if (lines.length) out += linesToSentences(lines.join('\n')) + '\n\n';
  }
  let mediaOcred = 0;
  {
    const mediaNames = Object.keys(zip.files).filter(n => /^ppt\/media\/.*\.(png|jpe?g|gif|bmp)$/i.test(n) && !zip.files[n].dir).slice(0, 40);
    const blobs = [];
    for (const n of mediaNames) {
      if (blobs.length >= 10) break;
      const blob = await zip.file(n).async('blob');
      if (blob.size >= 25000) blobs.push(blob);
    }
    if (blobs.length) {
      try {
      await ensureReader('Tesseract', onProgress);
      const log = ocrLog(onProgress);
      const w = await makeOcrWorker(log);
      for (let i = 0; i < blobs.length; i++) {
        if (onProgress) onProgress('OCR media ' + (i + 1) + ' / ' + blobs.length);
        try { const t = await ocrOnce(blobs[i], w, log); if (t && t.trim()) { out += linesToSentences(t) + '\n\n'; mediaOcred++; } } catch (e) {}
      }
      await endOcrWorker(w);
      } catch (error) {
        if (!out.trim()) throw error;
        toast('Slide text was read, but embedded image OCR was unavailable.', 'error');
      }
    }
  }
  return { text: out, slides: nSlides, mediaOcred };
}

function svgTextContent(src) {
  try {
    const doc = new DOMParser().parseFromString(src, 'image/svg+xml');
    if (doc.getElementsByTagName('parsererror').length) return '';
    const out = [];
    const push = el => {
      const s = (el.textContent || '').replace(/\s+/g, ' ').trim();
      if (s) out.push(/[.!?]$/.test(s) ? s : s + '.');
    };
    doc.querySelectorAll('text').forEach(el => { if (!el.querySelector('tspan')) push(el); });
    doc.querySelectorAll('tspan').forEach(push);
    doc.querySelectorAll('title,desc').forEach(push);
    return out.join(' ');
  } catch (e) { return ''; }
}

async function extract(file, onProgress) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'pdf') await ensureReader('pdfjsLib', onProgress);
  if (ext === 'docx') await ensureReader('mammoth', onProgress);
  if (ext === 'pptx') await ensureReader('JSZip', onProgress);
  if (IMAGE_EXT.has(ext) && ext !== 'svg') await ensureReader('Tesseract', onProgress);
  if (ext === 'pdf') {
    if (!window.pdfjsLib) throw new Error('PDF engine failed to load (offline?)');
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const pg = await pdf.getPage(i);
      const tc = await pg.getTextContent();
      text += tc.items.map(it => it.str).join(' ') + '\n\n';
      if (onProgress) onProgress('page ' + i + ' / ' + pdf.numPages);
    }
    if (!text.trim()) {
      await ensureReader('Tesseract', onProgress);
      if (onProgress) onProgress('scanned PDF \u00B7 preparing OCR...');
      const log = ocrLog(onProgress);
      const w = await makeOcrWorker(log);
      let ocr = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        if (onProgress) onProgress('OCR page ' + i + ' / ' + pdf.numPages);
        const pg = await pdf.getPage(i);
        const v1 = pg.getViewport({ scale: 1 });
        const scale = Math.min(2.5, Math.max(1.2, OCR_MAX_DIM / Math.max(v1.width, v1.height)));
        const vp = pg.getViewport({ scale });
        const c = document.createElement('canvas');
        c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
        await pg.render({ canvasContext: c.getContext('2d', { willReadFrequently: true }), viewport: vp }).promise;
        try { ocr += (await ocrOnce(c, w, log)).replace(/\s*\n\s*/g, ' ').trim() + '\n\n'; } catch (e) {}
      }
      await endOcrWorker(w);
      if (ocr.replace(/\s+/g, '').length > text.replace(/\s+/g, '').length) text = ocr;
      return { text, pages: pdf.numPages, ocr: true };
    }
    return { text, pages: pdf.numPages };
  }
  if (ext === 'docx') {
    if (!window.mammoth) throw new Error('DOCX engine failed to load (offline?)');
    const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return { text: r.value };
  }
  if (ext === 'pptx') {
    const r = await pptxToText(await file.arrayBuffer(), onProgress);
    let note = r.slides + ' slides';
    if (r.mediaOcred) note += ' \u00B7 OCR x' + r.mediaOcred;
    return { text: r.text, slides: r.slides, note };
  }
  if (ext === 'ppt') {
    const t = utf16Runs(await file.arrayBuffer(), 6);
    const text = t.replace(/\s+/g, '').length >= 200 ? t : stripBinary(await file.text());
    return { text, note: 'legacy .ppt \u00B7 best-effort' };
  }
  if (ext === 'doc') {
    const t = utf16Runs(await file.arrayBuffer(), 6);
    const text = t.replace(/\s+/g, '').length >= 200 ? t : stripBinary(await file.text());
    return { text, note: 'legacy .doc \u00B7 best-effort' };
  }
  if (ext === 'rtf') return { text: stripRtf(await file.text()), note: 'RTF \u00B7 best-effort' };
  if (ext === 'html' || ext === 'htm') {
    const div = document.createElement('div');
    div.innerHTML = (await file.text()).replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<style[\s\S]*?<\/style>/gi, '');
    return { text: div.textContent || '' };
  }
  if (ext === 'svg') return { text: svgTextContent(await file.text()), note: 'SVG text' };
  if (IMAGE_EXT.has(ext)) {
    if (!window.Tesseract) throw new Error('OCR engine failed to load (offline?)');
    if (onProgress) onProgress('OCR engine \u00B7 first run downloads the model (~10 MB)');
    const { canvas, w, h } = await imageToCanvas(file, OCR_MAX_DIM);
    const log = ocrLog(onProgress);
    const wk = await makeOcrWorker(log);
    let text = '';
    try { text = await ocrOnce(canvas, wk, log); } finally { await endOcrWorker(wk); }
    return { text: linesToSentences(text), ocr: true, dims: w + 'x' + h };
  }
  return { text: await file.text() };
}

/* ---------- GitHub capture ---------- */
function parseGhUrl(q) {
  if (!q || !q.trim()) throw new Error('Paste a GitHub repo URL first - e.g. github.com/kubernetes/kubernetes');
  let s = q.trim().split(/[?#]/)[0].replace(/\/+$/, '');
  s = s.replace(/^https?:\/\//i, '').replace(/^www\./i, '');
  if (/^github\.com\//i.test(s)) s = s.slice(11);
  else if (/^github\.com$/i.test(s)) throw new Error('Almost - add the repo: github.com/owner/repo');
  const seg = s.split('/').filter(Boolean);
  if (seg.length < 2) throw new Error('That does not look like a GitHub repo - use github.com/owner/repo');
  const owner = seg[0], repo = seg[1].replace(/\.git$/i, '');
  if (!/^[\w.-]+$/.test(owner) || !/^[\w.-]+$/.test(repo)) throw new Error('That does not look like a valid GitHub owner/repo');
  let kind = 'root', branch = null, path = '';
  if (seg.length >= 4 && (seg[2] === 'tree' || seg[2] === 'blob')) {
    kind = seg[2]; branch = seg[3];
    try { path = seg.slice(4).map(decodeURIComponent).join('/'); } catch (e) { path = seg.slice(4).join('/'); }
  } else if (seg.length > 2) {
    try { path = seg.slice(2).map(decodeURIComponent).join('/'); } catch (e) { path = seg.slice(2).join('/'); }
  }
  if (kind === 'blob' && !path) kind = 'root';
  const label = owner + '/' + repo + (kind === 'blob' && path ? ' \u00B7 ' + path.split('/').pop() : '');
  return { owner, repo, kind, branch, path, label };
}
async function ghApi(url) {
  const r = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
  if (r.status === 403 || r.status === 429) {
    if (r.headers.get('x-ratelimit-remaining') === '0')
      throw new Error('GitHub API rate limit reached (60 requests/hour without a token) - try again later');
    throw new Error('GitHub refused the request (HTTP ' + r.status + ')');
  }
  if (r.status === 404) throw new Error('Repository or branch not found - private repos cannot be read without a token');
  if (!r.ok) throw new Error('GitHub error HTTP ' + r.status);
  return r.json();
}
async function ghRaw(owner, repo, branch, path) {
  const url = 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/' +
    encodeURIComponent(branch || 'HEAD') + '/' + path.split('/').map(encodeURIComponent).join('/');
  return fetch(url);
}
const GH_DOC_EXT = /\.(md|mdx|txt|rst)$/i;
function ghDocScore(p) {
  const parts = p.split('/'), base = parts[parts.length - 1].toLowerCase();
  let s = 0;
  if (parts.length === 1 && base.startsWith('readme')) s += 120;
  else if (base.startsWith('readme')) s += 26;
  if (/^(docs?|architecture|arch|adr|adrs|design|rfc)\//i.test(p)) s += 34;
  if (/architect|design|overview|adr|rfc|decision|diagram/.test(base)) s += 45;
  s -= (parts.length - 1) * 2;
  return s;
}
function ghDocBad(p) {
  if (/(^|\/)(node_modules|vendor|dist|build|out|target|coverage|\.github|\.vscode)\//i.test(p)) return true;
  const base = p.split('/').pop();
  return /(changelog|^licen[cs]e$|code_of_conduct|contributing|security\.md|pull_request_template|issue_template|\.lock$)/i.test(base);
}

async function captureFromGitHub(q) {
  let target;
  try { target = parseGhUrl(q); }
  catch (e) { toast(e.message, 'error'); return; }
  if (processing) { toast('A capture is already running - one moment.', 'error'); return; }
  processing = true;
  state.view = 'processing'; render();
  const ctl = openProcView({ name: target.label });
  try {
    ctl.setStep(0, 'active');
    if (target.kind === 'blob') {
      const r = await ghRaw(target.owner, target.repo, target.branch, target.path);
      if (!r.ok) throw new Error('Could not fetch that file (HTTP ' + r.status + ') - private repos cannot be read without a token');
      const text = await r.text();
      ctl.setStep(0, 'done', 'single file');
      ctl.setStep(1, 'active');
      await analyzeSteps(ctl,
        { name: target.owner + '/' + target.repo + ' - ' + target.path.split('/').pop(), type: 'REPO', size: text.length, note: 'github \u00B7 ' + target.path },
        { text }, fmtInt(text.length) + ' chars');
    } else {
      const meta = await ghApi('https://api.github.com/repos/' + target.owner + '/' + target.repo);
      const branch = target.branch || meta.default_branch || 'main';
      await ctl.finishStep(0, 300, target.owner + '/' + target.repo + ' \u00B7 ' + branch);
      ctl.setStep(1, 'active');
      const tree = await ghApi('https://api.github.com/repos/' + target.owner + '/' + target.repo + '/git/trees/' + encodeURIComponent(branch) + '?recursive=1');
      const all = (tree.tree || []).filter(e => e.type === 'blob' && GH_DOC_EXT.test(e.path) && !ghDocBad(e.path) && e.size <= 150000);
      let picked = target.path
        ? all.filter(e => e.path === target.path || e.path.startsWith(target.path + '/'))
        : all.filter(e => e.path.split('/').length <= 6);
      picked.sort((a, b) => ghDocScore(b.path) - ghDocScore(a.path));
      picked = picked.slice(0, 15);
      if (!picked.length) throw new Error(target.path
        ? 'No markdown/text docs under that folder in that repo'
        : 'No markdown or text docs found in that repo');
      let out = '', total = 0, got = 0;
      for (let i = 0; i < picked.length; i++) {
        const f = picked[i];
        ctl.progress((i + 1) + ' / ' + picked.length + ' \u00B7 ' + f.path.split('/').pop());
        try {
          const r = await ghRaw(target.owner, target.repo, branch, f.path);
          if (!r.ok) continue;
          let t = await r.text();
          if (total + t.length > 600000) t = t.slice(0, Math.max(0, 600000 - total));
          if (!t.trim()) continue;
          out += '\n\n# FILE: ' + f.path + '\n\n' + t;
          total += t.length; got++;
        } catch (e) {}
        if (total >= 600000) break;
      }
      if (!got) throw new Error('Docs were listed but every fetch failed - network issue or rate limit');
      await analyzeSteps(ctl,
        { name: target.owner + '/' + target.repo, type: 'REPO', size: total, note: 'github \u00B7 ' + got + ' files \u00B7 ' + branch },
        { text: out }, got + ' files \u00B7 ' + fmtInt(total) + ' chars');
    }
  } catch (err) {
    ctl.fail('GitHub fetch failed');
    toast(err.message || 'Could not fetch that repository', 'error');
    await wait(600);
  } finally { processing = false; }
}

async function analyzeSteps(ctl, meta, ex, step1Note) {
  const text = humanize((ex.text || '').replace(/\u0000/g, ''));
  const minChars = 1;
  if (text.replace(/\s+/g, '').length < minChars) {
    ctl.fail('No readable text');
    toast(meta.type === 'REPO'
      ? 'No readable text came back from that repo - it may have no markdown docs, or the fetches were rate-limited.'
      : ((ex.ocr || ex.scanned)
        ? '"' + meta.name + '" gave no readable text even after OCR - try a sharper image or a text-based copy.'
        : '"' + meta.name + '" has no extractable text. Scanned PDFs and images are auto-OCR-read, but this one came back empty - is it blank or encrypted?'), 'error');
    await wait(800); return;
  }
  await ctl.finishStep(1, 380, step1Note);
  ctl.setStep(2, 'active');
  const a = analyze(text);
  await ctl.showSignals(a.topTerms);
  ctl.setStep(2, 'done', a.stats.hits + ' signal hits \u00B7 ' + a.topTerms.length + ' key terms');
  ctl.setStep(3, 'active');
  await ctl.showPatterns(a.patterns.slice(0, 10));
  const d = {
    id: uid(), name: meta.name, type: meta.type,
    size: meta.size, addedAt: Date.now(), text: text, note: meta.note || '',
    analysis: Object.assign({}, a, {
      patterns: a.patterns.map(p => Object.assign(p, { lastSeen: 0 }))
    })
  };
  store.docs.push(d); saveStore();
  ctl.setStep(3, 'done', a.patterns.length + ' diagrams + graph model ready');
  await wait(620);
  state.view = 'doc'; state.docId = d.id; state.focusPid = null; render();
  toast('FocusedLearning captured "' + meta.name + '" - ' + a.patterns.length + ' patterns connected & filed.');
}

async function processOne(file) {

  ctl.setStep(1, 'active');

  await analyzeSteps(ctl,
    { name: file.name, type: TYPE_LABEL[file.name.split('.').pop().toLowerCase()] || 'FILE', size: file.size, note },

function openProcView(file) {
  const m = $('#main');
  const labels = ['Read source', 'Extract \u00B7 fetch \u00B7 OCR', 'Match signals', 'Sketch & connect'];
  m.innerHTML = '<div class="proc"><div class="kicker">FocusedLearning</div>' +
    '<h1 class="title" style="font-size:29px">' + esc(file.name) + '</h1>' +
    '<div class="steps">' + labels.map(l =>
      '<div class="step"><span class="step-state">' + RING + '</span><span class="step-label">' + l + '</span><span class="step-result"></span></div>').join('') +
    '</div><div class="sig-cloud" id="pSig"></div><div class="mp-wrap" id="pPats"></div><div class="proc-note" id="pNote"></div></div>';
  m.scrollTop = 0;
  const steps = [...m.querySelectorAll('.step')];
  const t0 = [0, 0, 0, 0];
  const alive = () => m.isConnected;
  return {
    setStep(i, s, result) {
      if (!alive()) return;
      const el = steps[i]; el.className = 'step ' + s;
      el.querySelector('.step-state').innerHTML = s === 'done' ? CHECK : s === 'active' ? SPIN : RING;
      if (result !== undefined) el.querySelector('.step-result').textContent = result;
      if (s === 'active') t0[i] = performance.now();
    },
    async finishStep(i, minMs, result) {
      const left = minMs - (performance.now() - t0[i]);
      if (left > 0) await wait(left);
      this.setStep(i, 'done', result);
    },
    progress(txt) { if (alive()) steps[1].querySelector('.step-result').textContent = txt; },
    async showSignals(terms) {
      if (!alive()) return;
      const box = $('#pSig');
      for (const t of terms.slice(0, 12)) {
        if (!alive()) return;
        const c = document.createElement('span');
        c.className = 'sig-chip';
        c.innerHTML = esc(humanize(t.t)) + ' <b>x' + t.n + '</b>';
        box.appendChild(c);
        await wait(70);
      }
      await wait(220);
    },
    async showPatterns(pats) {
      if (!alive()) return;
      const box = $('#pPats');
      for (const p of pats) {
        if (!alive()) return;
        const row = document.createElement('div');
        row.className = 'mp';
        row.innerHTML = '<span class="mp-dg">' + dsvg(p.id) + '</span>' +
          '<span class="mp-name">' + esc(LIBMAP[p.id].name) + '</span>' +
          '<div class="mp-track"><div class="mp-fill"></div></div><span class="mp-val">' + Math.round(p.conf * 100) + '%</span>';
        box.appendChild(row);
        requestAnimationFrame(() => { row.querySelector('.mp-fill').style.width = Math.round(p.conf * 100) + '%'; });
        await wait(170);
      }
      await wait(280);
    },
    fail(note) {
      if (!alive()) return;
      const active = steps.findIndex(s => s.classList.contains('active'));
      if (active >= 0) { steps[active].className = 'step done'; steps[active].querySelector('.step-state').innerHTML = ic('x', 14); steps[active].style.color = 'var(--acc)'; }
      $('#pNote').textContent = 'x ' + note + ' - nothing was added to the knowledgebase.';
    }
  };
}

  };

  $('#hlAll').textContent = marks.length;

    marks[hi].classList.remove('flash'); void marks[hi].offsetWidth; marks[hi].classList.add('flash');
    $('#hlCur').textContent = hi + 1;
  };
  $('#hlNext').onclick = () => go(1);
  $('#hlPrev').onclick = () => go(-1);

  if (state.focusPid) {
    const row = document.querySelector('#plist .prow[data-pid="' + state.focusPid + '"]');
    state.focusPid = null;
    if (row) {
      const head = row.querySelector('.prow-head'), body = row.querySelector('.prow-body');
      if (!row.classList.contains('open')) {
        row.classList.add('open'); head.setAttribute('aria-expanded', 'true');
        body.style.maxHeight = body.scrollHeight + 'px';
      }
      setTimeout(() => {
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const dg = row.querySelector('.p-diagram');
        if (dg) { dg.classList.add('dg-flash'); setTimeout(() => dg.classList.remove('dg-flash'), 1600); }
      }, 80);

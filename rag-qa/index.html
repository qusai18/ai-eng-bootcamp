<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Q&amp;A</title>
  <style>
    :root {
      --paper: #f4efe6;
      --ink: #1b1814;
      --muted: #7d756b;
      --line: rgba(27, 24, 20, 0.12);
      --accent: #9a3412;
      --card: #fffdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", sans-serif;
    }
    main { max-width: 820px; margin: 0 auto; padding: 40px 20px 72px; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    h2 { font-size: 0.85rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; }
    p { line-height: 1.5; }
    .lede { color: var(--muted); margin: 0 0 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }
    .row, .docs, .strategies, .scores, .examples { display: flex; flex-wrap: wrap; gap: 8px; }
    button, input, select { font: inherit; color: inherit; }
    .modes { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 12px; }
    .modes label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .file-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }
    button {
      border: 0;
      background: var(--accent);
      color: white;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
    }
    button.ghost, .strategies button, .examples button, .score button {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    button.active { background: var(--accent); color: white; border-color: var(--accent); }
    button:disabled { opacity: 0.6; cursor: wait; }
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .strategy { flex: 1 1 240px; text-align: left; padding: 12px; border-radius: 12px; }
    .strategy strong { display: block; margin-bottom: 4px; }
    .strategy span { display: block; color: var(--muted); font-size: 0.88rem; line-height: 1.4; }
    .ask { display: flex; gap: 10px; }
    article, .compare-item { white-space: pre-wrap; line-height: 1.55; }
    .error { color: #9f1239; }
    .source { border-top: 1px solid var(--line); padding: 12px 0; color: #3c372f; white-space: pre-wrap; }
    .best { border-color: var(--accent); }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .result-row {
      display: grid;
      grid-template-columns: 1.4fr 0.5fr 0.7fr 0.9fr 0.8fr;
      gap: 8px;
      padding: 8px 0;
      border-top: 1px solid var(--line);
      font-size: 0.92rem;
    }
    .result-row.winner { font-weight: 650; }
    @media (max-width: 640px) {
      .result-row { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .ask { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <h1>RAG Q&amp;A</h1>
    <p class="lede">Index one document or several, pick a chunking strategy, then score the answer from 0 to 5. The highest average score is the strategy to keep.</p>

    <h2>Documents</h2>
    <div class="modes">
      <label><input type="radio" name="mode" value="single" checked /> Single document</label>
      <label><input type="radio" name="mode" value="multiple" /> Multiple documents</label>
    </div>
    <div class="docs" id="docs"></div>
    <div class="row" style="margin-top: 10px;">
      <label class="ghost" style="border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer;">
        Upload document
        <input id="files" type="file" accept=".txt,.pdf,.docx,.ppt,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/plain" hidden />
      </label>
      <button type="button" class="ghost" id="clear-docs">Clear documents</button>
    </div>

    <h2>Chunking strategy</h2>
    <div class="strategies" id="strategies"></div>
    <div class="row" style="margin-top: 12px;">
      <button type="button" id="index-btn">Chunking Documents</button>
      <button type="button" class="ghost" id="compare">Compare all strategies</button>
    </div>
    <p class="meta" id="index-status"></p>
    <article class="card" id="index-results" hidden>
      <p id="cost-summary"></p>
      <p id="best-index"></p>
      <div id="index-table"></div>
    </article>

    <h2>Ask</h2>
    <form class="ask" id="ask-form">
      <input id="question" type="text" placeholder="Ask about the ingested documents" required maxlength="2000" />
      <button type="submit" id="submit">Ask</button>
    </form>
    <div class="examples" id="examples"></div>

    <article class="card" id="answer" hidden></article>
    <div class="score" id="score" hidden></div>
    <h2 id="sources-label" hidden>Retrieved chunks</h2>
    <div id="sources"></div>
    <div id="comparisons"></div>

    <h2>Best strategy</h2>
    <article class="card best" id="best">Rate an answer to see which chunking strategy you prefer.</article>
    <div class="scores" id="scores"></div>
  </main>
  <script>
    const state = {
      mode: "single",
      strategy: "recursive",
      strategies: [],
      last: null,
      files: [],
      indexedKey: "",
      bestStrategy: "",
      prompts: [],
    };

    const docsEl = document.querySelector("#docs");
    const strategiesEl = document.querySelector("#strategies");
    const answerEl = document.querySelector("#answer");
    const sourcesEl = document.querySelector("#sources");
    const sourcesLabel = document.querySelector("#sources-label");
    const scoreEl = document.querySelector("#score");
    const bestEl = document.querySelector("#best");
    const scoresEl = document.querySelector("#scores");
    const statusEl = document.querySelector("#index-status");
    const questionEl = document.querySelector("#question");

    function renderFiles() {
      docsEl.replaceChildren();
      if (!state.files.length) {
        const empty = document.createElement("p");
        empty.className = "meta";
        empty.textContent = state.mode === "single"
          ? "Upload one TXT, PDF, DOCX, or PowerPoint file."
          : "Upload up to 8 TXT, PDF, DOCX, or PowerPoint files.";
        docsEl.append(empty);
        return;
      }
      state.files.forEach((file, index) => {
        const row = document.createElement("div");
        row.className = "file-row";
        const name = document.createElement("span");
        name.textContent = file.name;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "ghost";
        remove.textContent = "Remove";
        remove.addEventListener("click", () => {
          state.files.splice(index, 1);
          renderFiles();
          refreshPrompts();
        });
        row.append(name, remove);
        docsEl.append(row);
      });
    }

    function renderStrategies() {
      strategiesEl.replaceChildren();
      state.strategies.forEach((item) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `strategy${item.id === state.strategy ? " active" : ""}`;
        const suggestedId = state.bestStrategy || (state.mode === "multiple" ? "document" : "recursive");
        const badge = state.bestStrategy ? "best" : "suggested";
        const title = document.createElement("strong");
        title.textContent = item.id === suggestedId ? `${item.name} · ${badge}` : item.name;
        const summary = document.createElement("span");
        summary.textContent = `${item.summary} Best for: ${item.best_for}.`;
        button.append(title, summary);
        button.addEventListener("click", () => {
          state.strategy = item.id;
          renderStrategies();
        });
        strategiesEl.append(button);
      });
    }

    function showRecommendation(recommendation, scores) {
      if (recommendation?.strategy) {
        bestEl.textContent = recommendation.reason;
      } else if (recommendation?.reason) {
        bestEl.textContent = `No ratings yet. ${recommendation.reason}`;
      }
      scoresEl.replaceChildren();
      (scores || []).filter((row) => row.ratings > 0).forEach((row) => {
        const pill = document.createElement("button");
        pill.type = "button";
        pill.className = "ghost";
        pill.textContent = `${row.name}: ${row.average} / 5 (${row.ratings})`;
        scoresEl.append(pill);
      });
    }

    async function loadStrategies() {
      const response = await fetch("/strategies");
      const body = await response.json();
      state.strategies = body.strategies;
      if (!state.strategies.some((item) => item.id === state.strategy)) {
        state.strategy = body.mode === "multiple" ? "document" : "recursive";
      }
      renderStrategies();
      showRecommendation(body.recommendation, body.scores);
    }

    function showAnswer(result) {
      state.last = result;
      answerEl.hidden = false;
      answerEl.className = "card";
      answerEl.textContent = result.answer;
      sourcesLabel.hidden = false;
      sourcesEl.replaceChildren();
      result.sources.forEach((chunk) => {
        const block = document.createElement("div");
        block.className = "source";
        block.textContent = chunk;
        sourcesEl.append(block);
      });
      scoreEl.hidden = false;
      scoreEl.replaceChildren();
      const label = document.createElement("span");
      label.className = "meta";
      label.textContent = `Score this ${result.name || result.strategy} answer`;
      scoreEl.append(label);
      for (let score = 0; score <= 5; score += 1) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = String(score);
        button.addEventListener("click", () => sendScore(score, button));
        scoreEl.append(button);
      }
    }

    async function sendScore(score, button) {
      if (!state.last) return;
      button.disabled = true;
      const response = await fetch("/rate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          strategy: state.last.strategy,
          question: state.last.question,
          score,
        }),
      });
      const body = await response.json();
      if (!response.ok) {
        answerEl.className = "card error";
        answerEl.textContent = body.detail || "Could not save the score";
        return;
      }
      showRecommendation(body.recommendation, body.scores);
    }

    function renderPrompts() {
      const box = document.querySelector("#examples");
      box.replaceChildren();
      if (!state.files.length) {
        const note = document.createElement("p");
        note.className = "meta";
        note.textContent = "Upload a document to suggest questions.";
        box.append(note);
        return;
      }
      if (!state.prompts.length) {
        const note = document.createElement("p");
        note.className = "meta";
        note.textContent = "Writing questions from the document…";
        box.append(note);
        return;
      }
      state.prompts.forEach((prompt) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = prompt.label;
        button.title = prompt.question;
        button.addEventListener("click", () => {
          questionEl.value = prompt.question;
          ask(prompt.question);
        });
        box.append(button);
      });
    }

    async function refreshPrompts() {
      const key = filesKey();
      if (!state.files.length) {
        state.prompts = [];
        renderPrompts();
        return;
      }
      state.prompts = [];
      renderPrompts();
      const form = new FormData();
      state.files.forEach((file) => form.append("files", file));
      try {
        const response = await fetch("/prompts", { method: "POST", body: form });
        const body = await response.json();
        if (filesKey() !== key) return;
        if (!response.ok) throw new Error(typeof body.detail === "string" ? body.detail : "Could not write questions");
        state.prompts = body.prompts || [];
      } catch (error) {
        if (filesKey() !== key) return;
        state.prompts = [];
        const box = document.querySelector("#examples");
        box.replaceChildren();
        const note = document.createElement("p");
        note.className = "meta error";
        note.textContent = error.message;
        box.append(note);
        return;
      }
      renderPrompts();
    }

    function filesKey() {
      return `${state.mode}|${state.files.map((file) => `${file.name}:${file.size}:${file.lastModified}`).join("|")}`;
    }

    function money(usd) {
      return `$${Number(usd).toFixed(6)}`;
    }

    function renderIndexReport(report) {
      const panel = document.querySelector("#index-results");
      if (!report) {
        panel.hidden = true;
        return;
      }
      panel.hidden = false;
      document.querySelector("#cost-summary").textContent =
        `Embedding cost: ${report.total_tokens.toLocaleString()} tokens, about ${money(report.total_cost_usd)} ` +
        `(${report.model} at $${report.price_per_million} per 1M tokens).`;
      document.querySelector("#best-index").textContent =
        `Best performance: ${report.best_name} at ${report.best_performance} / 100, ` +
        `using ${report.best_tokens.toLocaleString()} tokens (${money(report.best_cost_usd)}).`;
      const table = document.querySelector("#index-table");
      table.replaceChildren();
      const header = document.createElement("div");
      header.className = "result-row meta";
      ["Strategy", "Chunks", "Tokens", "Cost", "Performance"].forEach((label) => {
        const cell = document.createElement("span");
        cell.textContent = label;
        header.append(cell);
      });
      table.append(header);
      report.rows.forEach((row) => {
        const line = document.createElement("div");
        line.className = `result-row${row.strategy === report.best_strategy ? " winner" : ""}`;
        [row.name, String(row.chunks), row.tokens.toLocaleString(), money(row.cost_usd), `${row.performance}`].forEach((value) => {
          const cell = document.createElement("span");
          cell.textContent = value;
          line.append(cell);
        });
        table.append(line);
      });
    }

    async function indexDocuments(force = false) {
      if (!state.files.length) {
        statusEl.textContent = "Upload a document before chunking.";
        return false;
      }
      if (state.mode === "single" && state.files.length !== 1) {
        statusEl.textContent = "Single document accepts one file.";
        return false;
      }
      if (!force && state.indexedKey === filesKey()) return true;
      statusEl.textContent = "Chunking every strategy…";
      const form = new FormData();
      form.append("mode", state.mode);
      form.append("strategy", state.strategy);
      state.files.forEach((file) => form.append("files", file));
      const response = await fetch("/documents", { method: "POST", body: form });
      const body = await response.json();
      if (!response.ok) {
        statusEl.textContent = typeof body.detail === "string" ? body.detail : "Indexing failed";
        return false;
      }
      state.indexedKey = filesKey();
      if (body.report?.best_strategy) {
        state.strategy = body.report.best_strategy;
        state.bestStrategy = body.report.best_strategy;
      }
      statusEl.textContent = `Indexed ${body.documents.length} document(s).`;
      renderIndexReport(body.report);
      showRecommendation(body.recommendation, null);
      await loadStrategies();
      return true;
    }

    async function ask(question) {
      const ready = await indexDocuments();
      if (!ready) return;
      const submit = document.querySelector("#submit");
      submit.disabled = true;
      answerEl.hidden = false;
      answerEl.className = "card";
      answerEl.textContent = "Looking up the documents…";
      sourcesEl.replaceChildren();
      sourcesLabel.hidden = true;
      scoreEl.hidden = true;
      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, strategy: state.strategy }),
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || "Request failed");
        const match = state.strategies.find((item) => item.id === body.strategy);
        showAnswer({ ...body, question, name: match ? match.name : body.strategy });
      } catch (error) {
        answerEl.className = "card error";
        answerEl.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    }

    document.querySelectorAll('input[name="mode"]').forEach((input) => {
      input.addEventListener("change", () => {
        if (!input.checked) return;
        state.mode = input.value;
        state.strategy = state.mode === "multiple" ? "document" : "recursive";
        document.querySelector("#files").multiple = state.mode === "multiple";
        if (state.mode === "single" && state.files.length > 1) {
          state.files = state.files.slice(0, 1);
          statusEl.textContent = "Single document keeps the first file.";
        }
        renderFiles();
        renderStrategies();
        if (state.mode === "single") refreshPrompts();
      });
    });

    document.querySelector("#files").addEventListener("change", (event) => {
      const picked = [...event.target.files];
      event.target.value = "";
      if (!picked.length) return;
      if (state.mode === "single") {
        state.files = picked.slice(0, 1);
      } else {
        const names = new Set(state.files.map((file) => file.name));
        picked.forEach((file) => {
          if (state.files.length >= 8 || names.has(file.name)) return;
          names.add(file.name);
          state.files.push(file);
        });
      }
      renderFiles();
      refreshPrompts();
    });

    document.querySelector("#index-btn").addEventListener("click", () => indexDocuments(true));

    document.querySelector("#clear-docs").addEventListener("click", async () => {
      await fetch("/reset", { method: "POST" });
      state.files = [];
      state.indexedKey = "";
      state.bestStrategy = "";
      state.prompts = [];
      state.last = null;
      renderFiles();
      renderPrompts();
      answerEl.hidden = true;
      scoreEl.hidden = true;
      sourcesLabel.hidden = true;
      sourcesEl.replaceChildren();
      document.querySelector("#comparisons").replaceChildren();
      document.querySelector("#index-results").hidden = true;
      statusEl.textContent = "Documents, index, and scores cleared.";
      await loadStrategies();
    });
    document.querySelector("#ask-form").addEventListener("submit", (event) => {
      event.preventDefault();
      ask(questionEl.value.trim());
    });
    document.querySelector("#compare").addEventListener("click", async () => {
      const question = questionEl.value.trim() || state.prompts[0]?.question || "";
      if (!question) {
        statusEl.textContent = "Upload a document or type a question before comparing strategies.";
        return;
      }
      questionEl.value = question;
      const ready = await indexDocuments();
      if (!ready) return;
      const button = document.querySelector("#compare");
      button.disabled = true;
      const box = document.querySelector("#comparisons");
      box.textContent = "Running every strategy…";
      try {
        const response = await fetch("/compare", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || "Compare failed");
        box.replaceChildren();
        body.results.forEach((result) => {
          const item = document.createElement("article");
          item.className = "card";
          item.style.marginTop = "12px";
          const title = document.createElement("strong");
          title.textContent = `${result.name} · ${result.chunk_count} chunks`;
          const text = document.createElement("p");
          text.textContent = result.answer;
          const rating = document.createElement("div");
          rating.className = "score";
          for (let score = 0; score <= 5; score += 1) {
            const scoreButton = document.createElement("button");
            scoreButton.type = "button";
            scoreButton.textContent = String(score);
            scoreButton.addEventListener("click", async () => {
              state.last = { strategy: result.strategy, question };
              await sendScore(score, scoreButton);
            });
            rating.append(scoreButton);
          }
          item.append(title, text, rating);
          box.append(item);
        });
        showRecommendation(body.recommendation, null);
      } catch (error) {
        box.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    renderFiles();
    renderPrompts();
    loadStrategies();
  </script>
</body>
</html>

# Ask chat: Docker API + static Next.js site.
# Apply this Blueprint from the Render Dashboard (New > Blueprint).
# Set OPENAI_API_KEY on ask-api, github-crew, and focused-learning when Render prompts for it.
services:
  - type: web
    name: ask-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: ask
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: ./web/out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ask-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: github-crew
    runtime: docker
    plan: free
    dockerfilePath: ./githubcrew/Dockerfile
    dockerContext: ./githubcrew
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: focused-learning
    runtime: docker
    plan: free
    dockerfilePath: ./focused_learning/Dockerfile
    dockerContext: ./focused_learning
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: maryiam-daily-jobs
    runtime: docker
    plan: free
    dockerfilePath: ./ai-engineering-maryiam-main/maryiam-daily-jobs/Dockerfile
    dockerContext: ./ai-engineering-maryiam-main/maryiam-daily-jobs
    healthCheckPath: /api/health

  - type: web
    name: rag-qa
    runtime: docker
    plan: free
    dockerfilePath: ./rag-qa/Dockerfile
    dockerContext: ./rag-qa
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: agentic-memory-lab
    runtime: docker
    plan: free
    dockerfilePath: ./agentic-memory/demo-ui/Dockerfile
    dockerContext: ./agentic-memory/demo-ui
    healthCheckPath: /

  - type: web
    name: ragdoll2
    runtime: static
    buildCommand: echo static
    staticPublishPath: ./ragdoll2
    routes:
      - type: rewrite
        source: /
        destination: /index.html

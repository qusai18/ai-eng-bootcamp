# Ask chat: Docker API + static Next.js site.
# Apply this Blueprint from the Render Dashboard (New > Blueprint).
# Set OPENAI_API_KEY on ask-api when Render prompts for it.
services:
  - type: web
    name: ask-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: ask
    runtime: static
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: ./web/out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ask-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: maryiam-daily-jobs
    runtime: docker
    plan: free
    dockerfilePath: ./ai-engineering-maryiam-main/maryiam-daily-jobs/Dockerfile
    dockerContext: ./ai-engineering-maryiam-main/maryiam-daily-jobs
    healthCheckPath: /api/health

services:
  api:
    build:
      context: ./backend
    environment:
      PORT: "8000"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CACHE_TTL: ${CACHE_TTL:-60}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
